name: hourly refresh
on:
  schedule:
    - cron: "40 * * * *"     # hourly, :40 past
  workflow_dispatch:
concurrency: daily
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pull and build
        working-directory: scripts
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          BLOCKSCOUT_KEY: ${{ secrets.BLOCKSCOUT_KEY }}
        run: |
          python -u pull_deposits.py ethereum arbitrum optimism base polygon bnb solana | grep -v "so far"
          python -u pull_x402.py
          python build_deposits.py
          python build_x402.py
      # the site reads src/data straight from this repo (re-checked every 5 min), so a push is enough: no redeploy
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw src/data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%FT%H:%MZ)"
          git pull --rebase && git push
